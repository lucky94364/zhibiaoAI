[project]
name = "zhibiao-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
